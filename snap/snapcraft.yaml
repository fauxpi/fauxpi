name: fauxpi
title: FauxPi
base: core24
# The version is the latest <release> in the AppStream metadata
adopt-info: fauxpi
summary: Raspberry Pi hardware simulator
description: |
  FauxPi is a Raspberry Pi hardware simulator supporting the Raspberry Pi 1
  (A+, B+), Raspberry Pi 3 (A+, B+), and Raspberry Pi Zero (Zero, Zero W,
  Zero 2 W) families.

  Features:
  - VideoCore IV HVS/V3D graphics and HDMI display output
  - Interactive board sheet to connect/disconnect peripherals, inspect GPIO
    pins, and adjust CPU temperature
  - Copy-on-write QCOW2 SD card image management
  - USB HID keyboard/mouse, user-mode NAT Ethernet & Wi-Fi, and audio playback
license: MIT
website: https://github.com/fauxpi/fauxpi
source-code: https://github.com/fauxpi/fauxpi
issues: https://github.com/fauxpi/fauxpi/issues
contact: https://github.com/fauxpi/fauxpi/issues
grade: stable
confinement: strict
icon: data/io.github.fauxpi.Fauxpi.svg

# FauxPi loads its audio libraries with dlopen, which the linter can't see
lint:
  ignore:
    - library:
        - usr/lib/*/libasound.so*
        - usr/lib/*/libpulse.so*
        - usr/lib/*/libpulse-simple.so*

platforms:
  amd64:
  arm64:

# EGL (for VideoCore IV graphics) comes from the mesa-2404 snap
plugs:
  gpu-2404:
    interface: content
    target: $SNAP/gpu-2404
    default-provider: mesa-2404

layout:
  /usr/share/libdrm:
    bind: $SNAP/gpu-2404/libdrm
  /usr/share/drirc.d:
    symlink: $SNAP/gpu-2404/drirc.d

apps:
  fauxpi:
    command: usr/bin/fauxpi
    command-chain:
      - bin/desktop-sockets
      - bin/gpu-2404-wrapper
    desktop: usr/share/applications/io.github.fauxpi.Fauxpi.desktop
    common-id: io.github.fauxpi.Fauxpi
    environment:
      XDG_DATA_HOME: $SNAP_USER_DATA/.local/share
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
    plugs:
      - wayland
      - desktop
      - opengl
      - audio-playback
      - network

parts:
  fauxpi:
    plugin: nil
    # The committed tree, not the folder: build caches there run to gigabytes
    source: .
    source-type: git
    parse-info: [usr/share/metainfo/io.github.fauxpi.Fauxpi.metainfo.xml]
    # Zig from the Zig snap: ziglang.org downloads take minutes. If the channel moves past the
    # version scripts/zig pins, the script downloads that version instead.
    build-snaps:
      - zig/latest/beta
    build-packages:
      - ca-certificates
      - curl
      - python3
      - tar
      - xz-utils
    stage-packages:
      - libpulse0
      - libasound2t64
    override-build: |
      ./scripts/zig build -Doptimize=ReleaseFast --prefix "$CRAFT_PART_INSTALL/usr"
      install -Dm644 data/io.github.fauxpi.Fauxpi.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/io.github.fauxpi.Fauxpi.desktop"
      install -Dm644 data/io.github.fauxpi.Fauxpi.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.fauxpi.Fauxpi.svg"
      install -Dm644 data/io.github.fauxpi.Fauxpi.metainfo.xml \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/io.github.fauxpi.Fauxpi.metainfo.xml"

  gpu-2404:
    after: [fauxpi]
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404
    prime:
      - bin/gpu-2404-wrapper

  desktop-sockets:
    plugin: dump
    source: snap/local
