name: CI

on:
  push:
    branches: [main]
    tags: ['*'] # a release, e.g. 26.10 or 26.10.1
  pull_request:

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0 # the version scripts/zig pins
      - run: zig fmt --check build.zig build.zig.zon src

  test:
    name: Run tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0 # the version scripts/zig pins
      - run: zig build test --summary all

  snap:
    name: Build snap (${{ matrix.arch }})
    needs: [format, test] # nothing reaches the store unless these pass
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: fauxpi-snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
      # Pushes to main go to the edge channel and release tags to stable. Pull requests only build.
      - if: github.event_name == 'push'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ startsWith(github.ref, 'refs/tags/') && 'stable' || 'edge' }}
