id: io.github.robert_ancell.FauxPi
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: fauxpi

finish-args:
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network

modules:
  - name: fauxpi
    buildsystem: simple
    build-commands:
      - ./scripts/zig build -Doptimize=ReleaseFast --prefix /app
      - install -Dm644 data/io.github.robert_ancell.FauxPi.desktop /app/share/applications/io.github.robert_ancell.FauxPi.desktop
      - install -Dm644 data/io.github.robert_ancell.FauxPi.svg /app/share/icons/hicolor/scalable/apps/io.github.robert_ancell.FauxPi.svg
      - install -Dm644 data/io.github.robert_ancell.FauxPi.metainfo.xml /app/share/metainfo/io.github.robert_ancell.FauxPi.metainfo.xml
    sources:
      - type: dir
        path: .
      - type: archive
        only-arches:
          - x86_64
        url: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
        sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        dest: build/zig/zig-x86_64-linux-0.17.0
      - type: archive
        only-arches:
          - aarch64
        url: https://ziglang.org/download/0.17.0/zig-aarch64-linux-0.17.0.tar.xz
        sha256: 9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
        dest: build/zig/zig-aarch64-linux-0.17.0
