<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- PCB Board Background -->
  <rect x="12" y="20" width="104" height="88" rx="10" fill="#1b7340" stroke="#13522d" stroke-width="3"/>
  <!-- Mounting Holes -->
  <circle cx="24" cy="32" r="5" fill="#101418" stroke="#d4af37" stroke-width="2.5"/>
  <circle cx="104" cy="32" r="5" fill="#101418" stroke="#d4af37" stroke-width="2.5"/>
  <circle cx="24" cy="96" r="5" fill="#101418" stroke="#d4af37" stroke-width="2.5"/>
  <circle cx="104" cy="96" r="5" fill="#101418" stroke="#d4af37" stroke-width="2.5"/>
  <!-- 40-pin GPIO Header -->
  <rect x="34" y="24" width="60" height="10" rx="2" fill="#22272e"/>
  <g fill="#d4af37">
    <circle cx="40" cy="27" r="1.5"/><circle cx="46" cy="27" r="1.5"/><circle cx="52" cy="27" r="1.5"/><circle cx="58" cy="27" r="1.5"/><circle cx="64" cy="27" r="1.5"/><circle cx="70" cy="27" r="1.5"/><circle cx="76" cy="27" r="1.5"/><circle cx="82" cy="27" r="1.5"/><circle cx="88" cy="27" r="1.5"/>
    <circle cx="40" cy="31" r="1.5"/><circle cx="46" cy="31" r="1.5"/><circle cx="52" cy="31" r="1.5"/><circle cx="58" cy="31" r="1.5"/><circle cx="64" cy="31" r="1.5"/><circle cx="70" cy="31" r="1.5"/><circle cx="76" cy="31" r="1.5"/><circle cx="82" cy="31" r="1.5"/><circle cx="88" cy="31" r="1.5"/>
  </g>
  <!-- Broadcom SoC -->
  <rect x="44" y="46" width="40" height="40" rx="4" fill="#262b33" stroke="#3c4450" stroke-width="2"/>
  <text x="64" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Pi</text>
  <!-- HDMI & USB Connectors -->
  <rect x="52" y="98" width="24" height="12" rx="2" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
</svg>
